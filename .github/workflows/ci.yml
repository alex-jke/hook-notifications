name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: no secrets or personal config committed
        run: |
          for f in .env config.yaml zuliprc; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then echo "::error::$f is committed"; exit 1; fi
          done
