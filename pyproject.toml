[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hooks"
version = "0.1.0"
description = "Personal notification hooks: forward Zulip messages (and more) to your phone via ntfy, Telegram, ..."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "zulip>=0.9",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
apprise = ["apprise>=1.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hooks = "hooks.__main__:main"

[tool.setuptools.packages.find]
include = ["hooks*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
